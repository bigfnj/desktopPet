<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<style>
  :root{
    --bg:#202020; --surface:#2d2d30; --surface2:#262629; --text:#f0f0f0; --muted:#aaaaaa;
    --border:#464646; --accent:#4aa3df; --accent-dim:#2b5a75; --on:#3ecf8e; --off:#6b6b6b;
    --warn:#e0b04a; --spicy:#e07a5a; --nsfw:#d15b7f;
  }
  *{box-sizing:border-box; font-family:"Segoe UI",Segoe,Tahoma,Arial,sans-serif;}
  html,body{height:100%;}
  body{background:#141414; color:var(--text); margin:0; padding:10px; overflow:hidden;}
  .body{height:100%; display:flex; flex-direction:row; gap:12px; min-height:0;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:11px;
        font-size:11px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); cursor:pointer; user-select:none;}
  .chip.on{background:rgba(62,207,142,.14); border-color:var(--on); color:var(--on);}
  .chip.clean{color:#8fd3b0;border-color:#2f5b47;} .chip.edgy{color:var(--spicy);border-color:#5b3a2f;}
  .chip.nsfw{color:var(--nsfw);border-color:#5b2f42;}
  .btn{background:var(--surface); border:1px solid var(--border); color:var(--text);
       padding:5px 12px; border-radius:4px; font-size:12px; cursor:pointer;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent-dim); border-color:var(--accent);}
  .btn.sm{padding:3px 9px; font-size:11px;}
  .btn[disabled]{opacity:.5; cursor:default;}
  .muted{color:var(--muted);} .grow{flex:1;}
  .row{display:flex; align-items:center; gap:8px;}
  .sw{width:34px; height:18px; border-radius:10px; background:#3a3a3a; position:relative; flex:none; border:1px solid var(--border); cursor:pointer;}
  .sw::after{content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:#8a8a8a; top:1px; left:1px; transition:.1s;}
  .sw.on{background:rgba(62,207,142,.35); border-color:var(--on);}
  .sw.on::after{left:17px; background:var(--on);}
  .statusdot{width:8px;height:8px;border-radius:50%;background:var(--on);display:inline-block;}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:5px; overflow:hidden;}
  .seg span{padding:4px 10px; font-size:11.5px; color:var(--muted); border-right:1px solid var(--border); cursor:pointer;}
  .seg span:last-child{border-right:none;}
  .seg span.sel{background:var(--accent-dim); color:var(--text);}
  .search{background:#1b1b1b; border:1px solid var(--border); color:var(--text); border-radius:4px; padding:5px 9px; font-size:12px;}
  .sectitle{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:2px 0;}
  .cnt{font-variant-numeric:tabular-nums;}
  .card{border:1px solid var(--border); border-radius:5px; background:var(--surface2); padding:10px;}
  /* table */
  .grid{flex:1; display:flex; flex-direction:column; min-width:0; border:1px solid var(--border); border-radius:5px; background:var(--surface2);}
  .head{display:flex; padding:5px 10px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .head span{cursor:pointer;}
  .scroll{overflow:auto; flex:1; font-size:12px;}
  .trow{display:flex; align-items:center; padding:5px 10px; border-bottom:1px solid #303030;}
  .trow:hover{background:rgba(74,163,223,.08);}
  .c-chk{width:26px; flex:none;} .c-src{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .c-col{width:170px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .c-vibe{width:60px; flex:none;} .c-lines{width:64px; flex:none; text-align:right;} .c-stat{width:74px; flex:none; text-align:right;}
  .rail{width:250px; flex:none; display:flex; flex-direction:column; gap:10px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div class="body">
  <!-- main: single filterable source table -->
  <div class="grid">
    <div class="row" style="padding:8px 10px; border-bottom:1px solid var(--border); gap:8px;">
      <input id="search" class="search" style="width:200px;" placeholder="Search sources…" autocomplete="off">
      <span id="pill-active" class="chip on">Active 0</span>
      <span id="pill-inactive" class="chip">Inactive 0</span>
      <div class="grow"></div>
      <button id="btn-all" class="btn sm">Enable all</button>
      <button id="btn-none" class="btn sm">Disable all</button>
    </div>
    <div class="head">
      <span class="c-chk">✓</span><span class="c-src" data-sort="src">Source</span>
      <span class="c-col" data-sort="col">Collection</span><span class="c-vibe">Vibe</span>
      <span class="c-lines" data-sort="lines">Lines</span><span class="c-stat">Status</span>
    </div>
    <div id="rows" class="scroll"></div>
    <div class="row" style="padding:7px 10px; border-top:1px solid var(--border);">
      <span id="foot" class="muted" style="font-size:11px;"></span>
    </div>
  </div>

  <!-- right rail: globals -->
  <div class="rail">
    <div class="card">
      <div class="row"><div id="smart-sw" class="sw"></div><b style="font-size:12.5px;">Smart fortunes</b></div>
      <div class="muted" style="font-size:11px; margin-top:5px;">Picks lines that fit what's on screen — a tiny bundled model, fully offline.</div>
      <div id="smart-status" class="chip on" style="margin-top:6px;"><span class="statusdot"></span><span id="smart-status-text">—</span></div>
      <button id="btn-rebuild" class="btn sm" style="margin-top:8px; width:100%;">↻ Rebuild smart weights</button>
    </div>
    <div class="card">
      <div class="sectitle">Content level</div>
      <div id="seg-level" class="seg" style="margin:6px 0;">
        <span data-level="clean">Clean</span><span data-level="edgy">+Spicy</span><span data-level="nsfw">+NSFW</span>
      </div>
      <label class="row muted" style="font-size:11.5px;"><input id="spicy-only" type="checkbox"> Skip the tame ones (spicy only)</label>
      <label class="row muted" style="font-size:11.5px; margin-top:4px;"><input id="no-profanity" type="checkbox"> Remove recognized profanity / explicit</label>
    </div>
    <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="sectitle">Genres <span id="genre-count" class="muted" style="text-transform:none; float:right;"></span></div>
      <div id="genres" style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; overflow:auto;"></div>
    </div>
    <button id="btn-apply" class="btn primary" style="padding:8px;">Apply changes</button>
    <div id="apply-status" class="muted" style="font-size:11px; min-height:14px;"></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var api = window.chrome && window.chrome.webview;
  var state = null;
  var filter = "";
  var sortKey = "src", sortAsc = true;

  function send(cmd, extra){
    if(!api) return;
    var m = { cmd: cmd };
    if(extra) for(var k in extra) m[k] = extra[k];
    api.postMessage(JSON.stringify(m));
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function vibeChip(r){
    if(r.hasSpicy && (r.vibe==="nsfw")) return '<span class="chip nsfw">nsfw</span>';
    if(r.hasSpicy) return '<span class="chip edgy">edgy</span>';
    return '<span class="chip clean">clean</span>';
  }

  function render(){
    if(!state){ return; }
    // smart
    document.getElementById("smart-sw").className = "sw" + (state.smartEnabled?" on":"");
    document.getElementById("smart-status-text").textContent = state.smartStatus || "—";
    // content level
    var level = state.spicyEnabled ? (state.spicyTier==="nsfw"?"nsfw":"edgy") : "clean";
    var seg = document.getElementById("seg-level").children;
    for(var i=0;i<seg.length;i++) seg[i].className = (seg[i].getAttribute("data-level")===level)?"sel":"";
    document.getElementById("spicy-only").checked = !!state.spicyOnly;
    document.getElementById("spicy-only").disabled = !state.spicyEnabled;
    document.getElementById("no-profanity").checked = !!state.noProfanity;
    // genres
    var g = document.getElementById("genres"); g.innerHTML = "";
    var on = 0;
    (state.genres||[]).forEach(function(gr){
      var el = document.createElement("span");
      el.className = "chip" + (gr.enabled?" on":"");
      el.textContent = gr.id; el.setAttribute("data-genre", gr.id);
      el.onclick = function(){ send("setGenre", { id: gr.id, enabled: !gr.enabled }); };
      g.appendChild(el); if(gr.enabled) on++;
    });
    document.getElementById("genre-count").textContent = on + " / " + (state.genres?state.genres.length:0);
    // table
    var rows = (state.sources||[]).slice();
    if(filter){ var f = filter.toLowerCase();
      rows = rows.filter(function(r){ return (r.id&&r.id.toLowerCase().indexOf(f)>=0) || (r.topic&&r.topic.toLowerCase().indexOf(f)>=0); }); }
    rows.sort(function(a,b){
      var av,bv;
      if(sortKey==="lines"){ av=a.lines; bv=b.lines; }
      else if(sortKey==="col"){ av=(a.topic||"").toLowerCase(); bv=(b.topic||"").toLowerCase(); }
      else { av=(a.id||"").toLowerCase(); bv=(b.id||"").toLowerCase(); }
      if(av<bv) return sortAsc?-1:1; if(av>bv) return sortAsc?1:-1; return 0;
    });
    var host = document.getElementById("rows"); host.innerHTML = "";
    rows.forEach(function(r){
      var d = document.createElement("div"); d.className = "trow" + (r.active?"":" muted");
      d.innerHTML =
        '<span class="c-chk"><input type="checkbox" '+(r.active?"checked":"")+'></span>'+
        '<span class="c-src">'+esc(r.id)+'</span>'+
        '<span class="c-col muted">'+esc(r.topic)+'</span>'+
        '<span class="c-vibe">'+vibeChip(r)+'</span>'+
        '<span class="c-lines cnt">'+ (r.lines!=null? Number(r.lines).toLocaleString():"—") +'</span>'+
        '<span class="c-stat" style="'+(r.active?"color:var(--on);":"")+'">'+(r.active?"Active":"Inactive")+'</span>';
      d.querySelector("input").onchange = function(ev){ send("setSource", { id: r.id, active: ev.target.checked }); };
      host.appendChild(d);
    });
    document.getElementById("pill-active").textContent = "Active " + state.activeSources;
    document.getElementById("pill-inactive").textContent = "Inactive " + (state.totalSources - state.activeSources);
    document.getElementById("foot").textContent =
      state.activeSources + " of " + state.totalSources + " sources active · " +
      Number(state.activeLines||0).toLocaleString() + " lines";
  }

  // ---- wire static controls once ----
  document.getElementById("search").addEventListener("input", function(e){ filter = e.target.value; render(); });
  document.getElementById("smart-sw").addEventListener("click", function(){ if(state) send("setSmart", { on: !state.smartEnabled }); });
  document.getElementById("btn-rebuild").addEventListener("click", function(){ send("rebuild"); });
  document.getElementById("btn-apply").addEventListener("click", function(){ send("apply"); });
  document.getElementById("btn-all").addEventListener("click", function(){ send("setAllSources", { active: true }); });
  document.getElementById("btn-none").addEventListener("click", function(){ send("setAllSources", { active: false }); });
  document.getElementById("spicy-only").addEventListener("change", function(e){ sendLevel(e.target.checked); });
  document.getElementById("no-profanity").addEventListener("change", function(e){ send("setNoProfanity", { on: e.target.checked }); });
  Array.prototype.forEach.call(document.getElementById("seg-level").children, function(sp){
    sp.addEventListener("click", function(){
      var lvl = sp.getAttribute("data-level");
      var spicy = lvl!=="clean";
      var tier = lvl==="nsfw" ? "nsfw" : "edgy";
      send("setContentLevel", { spicy: spicy, tier: tier, spicyOnly: document.getElementById("spicy-only").checked && spicy });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".head [data-sort]"), function(h){
    h.addEventListener("click", function(){
      var k = h.getAttribute("data-sort");
      if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=true; }
      render();
    });
  });
  function sendLevel(spicyOnly){
    var level = state && state.spicyEnabled ? (state.spicyTier==="nsfw"?"nsfw":"edgy") : "clean";
    send("setContentLevel", { spicy: level!=="clean", tier: level==="nsfw"?"nsfw":"edgy", spicyOnly: spicyOnly && level!=="clean" });
  }

  // ---- host -> page ----
  if(api){
    api.addEventListener("message", function(e){
      var msg = e.data;
      if(typeof msg === "string"){ try{ msg = JSON.parse(msg); }catch(_){ return; } }
      if(!msg) return;
      if(msg.type === "state"){ state = msg.state; render(); }
      else if(msg.type === "smartStatus"){ if(state){ state.smartStatus = msg.text; }
        document.getElementById("smart-status-text").textContent = msg.text || "—"; }
      else if(msg.type === "applyResult"){ var el=document.getElementById("apply-status");
        el.textContent = msg.message || ""; el.style.color = msg.ok? "var(--on)":"var(--warn)"; }
    });
  }
  // announce readiness so the host pushes initial state
  send("ready");
})();
</script>
</body>
</html>
