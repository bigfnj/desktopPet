name: release

# Push a vMAJOR.MINOR.PATCH tag (git tag v1.0.1 && git push origin v1.0.1) and this builds the
# x64 ZIP + MSI, writes SHA256SUMS.txt, and publishes them on a GitHub release for that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the x64 release
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up the .NET 10 SDK
        # Matches global.json's exact pin (rollForward "disable"). The old 10.0.201 pin existed because
        # 10.0.302 misreported the legacy net48 project's framework in `dotnet list package` -- there is no
        # net48 project and no list-package gate any more, so the reason is gone.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.302'

      - name: Select Visual Studio MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          vs-version: '[17.0,19.0)'
          msbuild-architecture: x64

      - name: Build Release x64 and the portable ZIP
        shell: pwsh
        run: .\build.ps1 -Release -Zip

      - name: Install WiX and build the MSI
        shell: pwsh
        run: |
          .\packaging\Install-LockedWixToolchain.ps1 `
            -PackageRoot (Join-Path $env:RUNNER_TEMP 'DesktopPet-WiX-5.0.2') `
            -GlobalExtension
          .\installer\build-installer.ps1 -Config Release

      - name: Pack the module-author NuGet packages
        # Attached to the release rather than pushed to nuget.org. That keeps a third-party author unblocked
        # -- point a local package source at the downloaded .nupkg files and the template's --standalone mode
        # restores -- without permanently claiming public package ids, and without committing to publish a new
        # package on every host release even when the contract has not changed. Pushing to nuget.org stays a
        # deliberate manual act: see packaging\New-NuGetPackages.ps1, which prints the command.
        shell: pwsh
        run: .\packaging\New-NuGetPackages.ps1 -OutputDirectory dist\nuget

      - name: Assemble release assets and checksums
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH; got '$tag'."
          }
          Push-Location dist
          $files = @('DesktopPet-Portable.zip', 'DesktopPet-AI-Edition.msi')
          # The author packages are checksummed too -- they are a build input for anyone writing a module,
          # so they deserve the same verifiability as the app downloads. Named relative to dist so the
          # SHA256SUMS lines stay copy-pasteable next to the file layout of the release.
          $packages = @(Get-ChildItem -LiteralPath 'nuget' -Filter '*.nupkg' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike '*.snupkg' } | ForEach-Object { "nuget/$($_.Name)" })
          if ($packages.Count -lt 2) { throw "Expected 2 author packages in dist\nuget; found $($packages.Count)." }
          $lines = foreach ($file in ($files + $packages)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
            "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $file"
          }
          $lines | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
          Pop-Location
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.assets.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "DesktopPet AI Edition $tag" `
              --notes "Unsigned x64 build for $tag. Verify downloads against SHA256SUMS.txt."
          }
          $assets = @(
            'dist/DesktopPet-Portable.zip',
            'dist/DesktopPet-AI-Edition.msi',
            'dist/SHA256SUMS.txt'
          ) + @(Get-ChildItem -LiteralPath 'dist/nuget' -Filter '*.nupkg' |
                Where-Object { $_.Name -notlike '*.snupkg' } | ForEach-Object { "dist/nuget/$($_.Name)" })
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @assets