name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package x64
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Pin the .NET SDK (10.0.302 misreports the legacy project framework)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.201'

      - name: Select Visual Studio MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          vs-version: '[17.0,19.0)'
          msbuild-architecture: x64

      - name: Build Release x64 and the portable ZIP
        shell: pwsh
        run: .\build.ps1 -Release -Zip

      - name: Build and run core regression tests
        shell: pwsh
        run: |
          msbuild .\tests\DesktopPet.CoreTests\DesktopPet.CoreTests.csproj -restore `
            -p:Configuration=Release -p:Platform=x64 -nologo -v:minimal
          & '.\tests\DesktopPet.CoreTests\bin\Release\DesktopPet.CoreTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed (exit $LASTEXITCODE)." }

      - name: Run product self-tests
        # Windows PowerShell 5.1 hosts the shipped net48 assembly the way it actually runs. The
        # product is a GUI-subsystem exe, so Start-Process -Wait is required to block for its exit
        # code -- `& $exe` returns immediately with no exit code for a GUI application.
        shell: powershell
        run: |
          $exe = 'build\DesktopPetPortable\bin\Release\x64\DesktopPet.exe'
          foreach ($test in @(
              '--filter-selftest',
              '--security-selftest',
              '--catalog-selftest',
              '--smart-selftest',
              '--fullscreen-selftest')) {
            $process = Start-Process -FilePath $exe -ArgumentList $test -Wait -PassThru -NoNewWindow
            if ($process.ExitCode -ne 0) { throw "$test failed (exit $($process.ExitCode))." }
          }
          .\tests\runtime-hardening-selftest.ps1 -ExecutablePath $exe
          .\tests\pettyperegistry-selftest.ps1 -ExecutablePath $exe
          # Options controller seam — needs an isolated data root so it never touches real settings.
          $env:DESKTOPPET_DATA_ROOT = Join-Path $env:RUNNER_TEMP ("dp-opt-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $env:DESKTOPPET_DATA_ROOT | Out-Null
          $opt = Start-Process -FilePath $exe -ArgumentList '--options-selftest' -Wait -PassThru -NoNewWindow
          if ($opt.ExitCode -ne 0) { throw "--options-selftest failed (exit $($opt.ExitCode))." }

      - name: Install WiX and build the MSI
        shell: pwsh
        run: |
          .\packaging\Install-LockedWixToolchain.ps1 `
            -PackageRoot (Join-Path $env:RUNNER_TEMP 'DesktopPet-WiX-5.0.2') `
            -GlobalExtension
          .\installer\build-installer.ps1 -Config Release

      - name: Upload the ZIP and MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DesktopPet-AI-Edition-x64
          path: |
            dist/DesktopPet-Portable.zip
            dist/DesktopPet-AI-Edition.msi
          if-no-files-found: error
